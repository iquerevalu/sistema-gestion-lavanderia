service: lavanderia-backend

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 30
  
  environment:
    NODE_ENV: production
    JWT_SECRET: jwt_secret_extremadamente_seguro_para_produccion_con_al_menos_64_caracteres_aqui
    JWT_EXPIRES_IN: 24h
    CORS_ORIGIN: "*"
    LOG_LEVEL: info

functions:
  api:
    handler: dist/lambda.handler
    description: 'API principal del sistema de gestión de guías de lavandería'
    events:
      - http:
          path: /{proxy+}
          method: ANY
          cors: true
      - http:
          path: /
          method: ANY
          cors: true

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3001
    host: 0.0.0.0

package:
  exclude:
    - .git/**
    - .gitignore
    - README.md
    - src/**
    - tests/**
    - '*.test.js'
    - coverage/**
    - .nyc_output/**
    - node_modules/aws-sdk/**
    - '**/*.map'
    - '**/*.ts'
    - tsconfig.json
    - .env*
  include:
    - dist/**
    - node_modules/**
    - package.json